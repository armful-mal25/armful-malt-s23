name: APK Auto Upload 8h\non:\n  push:\n    branches: [ main ]\n  workflow_dispatch:\n  schedule:\n    - cron: '0 */8 * * *'\njobs:\n  build-and-upload:\n    runs-on: ubuntu-latest\n    steps:\n      - name: 📥 Récupérer le code du dépôt\n        uses: actions/checkout@v4\n      - name: 🐍 Installer Python\n        uses: actions/setup-python@v5\n        with:\n          python-version: '3.9'\n      - name: 🌐 Installer Google Chrome\n        run: |\n          sudo apt-get update\n          sudo apt-get install -y google-chrome-stable\n      - name: 📦 Installer les bibliothèques Python\n        run: |\n          pip install DataRecorder DownloadKit DrissionPage requests\n      - name: 🚀 Lancer le script d'upload\n        run: python upload3.py
